<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hydra — Tracker Acqua</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #04111f;
    --surface: #071928;
    --card: #0a2035;
    --border: #0e3050;
    --water: #1a9fe0;
    --water-light: #4fc3f7;
    --water-glow: #00b4ff33;
    --accent: #00e5ff;
    --text: #e8f4fd;
    --muted: #5c8aaa;
    --danger: #ff5e7e;
    --goal: 2000;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'DM Mono', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    position: relative;
  }

  /* Ambient background */
  body::before {
    content: '';
    position: fixed;
    top: -40%;
    left: -20%;
    width: 140%;
    height: 70%;
    background: radial-gradient(ellipse at 50% 50%, #00b4ff0a 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* Wave animation at bottom */
  .wave-container {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 120px;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .wave {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 200%;
    height: 100%;
    opacity: 0.04;
    animation: waveMove 8s linear infinite;
  }
  .wave:nth-child(2) { animation-duration: 12s; animation-direction: reverse; opacity: 0.03; }

  @keyframes waveMove {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  /* HEADER */
  header {
    position: relative;
    z-index: 10;
    padding: 48px 24px 16px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .logo {
    font-family: 'DM Serif Display', serif;
    font-size: 28px;
    letter-spacing: -0.5px;
    color: var(--accent);
    text-shadow: 0 0 30px #00e5ff66;
  }

  .date-label {
    font-size: 10px;
    color: var(--muted);
    text-align: right;
    text-transform: uppercase;
    letter-spacing: 2px;
    line-height: 1.8;
  }

  /* MAIN CIRCLE */
  .circle-section {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8px 24px 24px;
  }

  .progress-ring-wrap {
    position: relative;
    width: 220px;
    height: 220px;
  }

  .progress-ring-wrap svg {
    transform: rotate(-90deg);
    filter: drop-shadow(0 0 16px #00b4ff44);
  }

  .ring-bg { fill: none; stroke: var(--border); stroke-width: 10; }
  .ring-fill {
    fill: none;
    stroke: url(#ringGrad);
    stroke-width: 10;
    stroke-linecap: round;
    stroke-dasharray: 628;
    stroke-dashoffset: 628;
    transition: stroke-dashoffset 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .ring-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
  }

  .ring-ml {
    font-family: 'DM Serif Display', serif;
    font-size: 44px;
    line-height: 1;
    color: var(--text);
    transition: all 0.3s ease;
  }

  .ring-unit {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .ring-pct {
    font-size: 12px;
    color: var(--accent);
    margin-top: 4px;
    font-weight: 500;
  }

  /* GOAL selector */
  .goal-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 14px;
  }

  .goal-label { font-size: 11px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }

  .goal-input {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--accent);
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    font-weight: 500;
    text-align: center;
    width: 76px;
    padding: 5px 8px;
    outline: none;
    transition: border-color 0.2s;
  }
  .goal-input:focus { border-color: var(--accent); }

  .goal-ml { font-size: 11px; color: var(--muted); }

  /* QUICK BUTTONS */
  .quick-section {
    position: relative;
    z-index: 10;
    padding: 0 20px;
  }

  .section-title {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: var(--muted);
    margin-bottom: 12px;
    padding-left: 4px;
  }

  .quick-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  .quick-btn {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    transition: all 0.18s ease;
    position: relative;
    overflow: hidden;
  }

  .quick-btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--water-glow);
    opacity: 0;
    transition: opacity 0.2s;
  }

  .quick-btn:active { transform: scale(0.94); border-color: var(--water); }
  .quick-btn:active::after { opacity: 1; }

  .quick-icon { font-size: 22px; }

  .quick-ml {
    font-size: 11px;
    font-weight: 500;
    color: var(--water-light);
  }

  .quick-label {
    font-size: 9px;
    color: var(--muted);
    text-align: center;
    line-height: 1.3;
  }

  /* CUSTOM INPUT */
  .custom-section {
    position: relative;
    z-index: 10;
    padding: 20px 20px 0;
  }

  .custom-row {
    display: flex;
    gap: 10px;
    align-items: stretch;
  }

  .custom-input-wrap {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 8px;
    transition: border-color 0.2s;
  }

  .custom-input-wrap:focus-within { border-color: var(--accent); }

  .custom-input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    font-family: 'DM Mono', monospace;
    font-size: 20px;
    font-weight: 500;
    color: var(--text);
    width: 100%;
    padding: 16px 0;
  }

  .custom-input::placeholder { color: var(--muted); }

  .custom-unit {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    letter-spacing: 1px;
  }

  .add-btn {
    background: var(--water);
    border: none;
    border-radius: 14px;
    padding: 0 20px;
    color: #fff;
    font-family: 'DM Mono', monospace;
    font-size: 22px;
    font-weight: 300;
    cursor: pointer;
    transition: all 0.18s ease;
    min-width: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 20px #1a9fe044;
  }

  .add-btn:active { transform: scale(0.92); background: var(--accent); }

  /* HISTORY */
  .history-section {
    position: relative;
    z-index: 10;
    padding: 20px 20px 120px;
    flex: 1;
  }

  .history-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .clear-btn {
    background: none;
    border: 1px solid #ff5e7e33;
    border-radius: 8px;
    color: var(--danger);
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    padding: 4px 10px;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
  }
  .clear-btn:active { background: #ff5e7e11; }

  .history-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .history-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    animation: slideIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-10px) scale(0.96); }
    to { opacity: 1; transform: none; }
  }

  .history-left { display: flex; align-items: center; gap: 12px; }

  .history-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--water);
    box-shadow: 0 0 8px var(--water);
    flex-shrink: 0;
  }

  .history-ml {
    font-size: 18px;
    font-weight: 500;
    color: var(--text);
  }

  .history-source {
    font-size: 10px;
    color: var(--muted);
    margin-top: 1px;
  }

  .history-time {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1px;
  }

  .history-del {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 16px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 8px;
    transition: all 0.2s;
    margin-left: 8px;
  }
  .history-del:active { color: var(--danger); background: #ff5e7e11; }

  .empty-state {
    text-align: center;
    padding: 40px 0;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 1px;
  }

  .empty-icon { font-size: 36px; margin-bottom: 12px; opacity: 0.4; }

  /* TOAST */
  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-80px);
    background: var(--accent);
    color: var(--bg);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    padding: 10px 20px;
    border-radius: 100px;
    z-index: 100;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    white-space: nowrap;
    pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* Goal reached */
  .goal-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #00e5ff14;
    border: 1px solid #00e5ff33;
    border-radius: 100px;
    padding: 4px 12px;
    font-size: 10px;
    color: var(--accent);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: 10px;
    opacity: 0;
    transform: scale(0.8);
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .goal-badge.show { opacity: 1; transform: scale(1); }
</style>
</head>
<body>

<div class="wave-container">
  <svg class="wave" viewBox="0 0 1440 120" preserveAspectRatio="none">
    <path fill="#00b4ff" d="M0,60 C360,100 720,20 1080,60 C1260,80 1380,40 1440,60 L1440,120 L0,120 Z"/>
  </svg>
  <svg class="wave" viewBox="0 0 1440 120" preserveAspectRatio="none">
    <path fill="#00b4ff" d="M0,80 C300,20 600,100 900,60 C1100,35 1320,80 1440,50 L1440,120 L0,120 Z"/>
  </svg>
</div>

<header>
  <div class="logo">Hydra</div>
  <div class="date-label" id="dateLabel"></div>
</header>

<!-- CERCHIO PROGRESS -->
<div class="circle-section">
  <div class="progress-ring-wrap">
    <svg width="220" height="220" viewBox="0 0 220 220">
      <defs>
        <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#00b4ff"/>
          <stop offset="100%" stop-color="#00e5ff"/>
        </linearGradient>
      </defs>
      <circle class="ring-bg" cx="110" cy="110" r="100"/>
      <circle class="ring-fill" id="ringFill" cx="110" cy="110" r="100"/>
    </svg>
    <div class="ring-center">
      <div class="ring-ml" id="ringMl">0</div>
      <div class="ring-unit">ml</div>
      <div class="ring-pct" id="ringPct">0%</div>
    </div>
  </div>

  <div class="goal-badge" id="goalBadge">🎯 Obiettivo raggiunto!</div>

  <div class="goal-row">
    <span class="goal-label">Obiettivo</span>
    <input type="number" class="goal-input" id="goalInput" value="2000" min="500" max="5000" step="100">
    <span class="goal-ml">ml</span>
  </div>
</div>

<!-- BOTTONI RAPIDI -->
<div class="quick-section">
  <div class="section-title">Aggiungi rapido</div>
  <div class="quick-grid">
    <button class="quick-btn" onclick="addWater(150, 'Shot')">
      <span class="quick-icon">🥃</span>
      <span class="quick-ml">150</span>
      <span class="quick-label">Shot</span>
    </button>
    <button class="quick-btn" onclick="addWater(250, 'Bicchiere')">
      <span class="quick-icon">🥤</span>
      <span class="quick-ml">250</span>
      <span class="quick-label">Bicchiere</span>
    </button>
    <button class="quick-btn" onclick="addWater(500, 'Bottiglietta')">
      <span class="quick-icon">🍶</span>
      <span class="quick-ml">500</span>
      <span class="quick-label">0.5L</span>
    </button>
    <button class="quick-btn" onclick="addWater(750, 'Sport')">
      <span class="quick-icon">🚰</span>
      <span class="quick-ml">750</span>
      <span class="quick-label">Sport</span>
    </button>
    <button class="quick-btn" onclick="addWater(1000, 'Grande')">
      <span class="quick-icon">🧴</span>
      <span class="quick-ml">1000</span>
      <span class="quick-label">1L</span>
    </button>
    <button class="quick-btn" onclick="addWater(330, 'Lattina')">
      <span class="quick-icon">🥫</span>
      <span class="quick-ml">330</span>
      <span class="quick-label">Lattina</span>
    </button>
    <button class="quick-btn" onclick="addWater(200, 'Caffè')">
      <span class="quick-icon">☕</span>
      <span class="quick-ml">200</span>
      <span class="quick-label">Caffè</span>
    </button>
    <button class="quick-btn" onclick="addWater(1500, 'Max')">
      <span class="quick-icon">💧</span>
      <span class="quick-ml">1500</span>
      <span class="quick-label">1.5L</span>
    </button>
  </div>
</div>

<!-- INPUT PERSONALIZZATO -->
<div class="custom-section">
  <div class="section-title" style="margin-top:20px;">Quantità personalizzata</div>
  <div class="custom-row">
    <div class="custom-input-wrap">
      <input type="number" class="custom-input" id="customInput" placeholder="es. 375" min="1" max="5000">
      <span class="custom-unit">ml</span>
    </div>
    <button class="add-btn" onclick="addCustom()">+</button>
  </div>
</div>

<!-- STORICO -->
<div class="history-section">
  <div class="history-header">
    <div class="section-title" style="margin-bottom:0">Oggi</div>
    <button class="clear-btn" onclick="clearAll()">Reset giornata</button>
  </div>
  <div class="history-list" id="historyList"></div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
  const STORAGE_KEY = 'hydra_data';
  const DATE_KEY = 'hydra_date';

  let state = { total: 0, goal: 2000, entries: [] };

  // ─── INIT ────────────────────────────────────────────────
  function init() {
    // date label
    const now = new Date();
    document.getElementById('dateLabel').innerHTML =
      now.toLocaleDateString('it-IT', { weekday: 'long' }).toLowerCase() + '<br>' +
      now.toLocaleDateString('it-IT', { day: 'numeric', month: 'long' });

    // check if new day
    const savedDate = localStorage.getItem(DATE_KEY);
    const todayStr = now.toDateString();
    if (savedDate !== todayStr) {
      localStorage.setItem(DATE_KEY, todayStr);
      state = { total: 0, goal: 2000, entries: [] };
      save();
    } else {
      load();
    }

    // goal input listener
    document.getElementById('goalInput').value = state.goal;
    document.getElementById('goalInput').addEventListener('change', e => {
      const v = parseInt(e.target.value) || 2000;
      state.goal = Math.max(500, Math.min(5000, v));
      document.getElementById('goalInput').value = state.goal;
      updateUI();
      save();
    });

    // custom input enter
    document.getElementById('customInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') addCustom();
    });

    updateUI();
  }

  // ─── ADD WATER ───────────────────────────────────────────
  function addWater(ml, label) {
    const entry = {
      id: Date.now(),
      ml,
      label,
      time: new Date().toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' })
    };
    state.entries.unshift(entry);
    state.total += ml;
    save();
    updateUI();
    showToast(`+${ml} ml aggiunto ✓`);

    if (state.total >= state.goal && state.total - ml < state.goal) {
      setTimeout(() => showToast('🎯 Obiettivo raggiunto! Ottimo lavoro!'), 800);
    }
  }

  function addCustom() {
    const input = document.getElementById('customInput');
    const ml = parseInt(input.value);
    if (!ml || ml <= 0 || ml > 5000) {
      shakeInput(input);
      return;
    }
    addWater(ml, 'Custom');
    input.value = '';
    input.blur();
  }

  function deleteEntry(id) {
    const entry = state.entries.find(e => e.id === id);
    if (!entry) return;
    state.total = Math.max(0, state.total - entry.ml);
    state.entries = state.entries.filter(e => e.id !== id);
    save();
    updateUI();
  }

  function clearAll() {
    if (!confirm('Resettare l\'intera giornata?')) return;
    state.total = 0;
    state.entries = [];
    save();
    updateUI();
  }

  // ─── UI ──────────────────────────────────────────────────
  function updateUI() {
    const pct = Math.min(100, Math.round((state.total / state.goal) * 100));
    const circumference = 2 * Math.PI * 100; // 628

    // ring
    const offset = circumference - (pct / 100) * circumference;
    document.getElementById('ringFill').style.strokeDashoffset = offset;
    document.getElementById('ringMl').textContent = state.total.toLocaleString('it-IT');
    document.getElementById('ringPct').textContent = pct + '%';

    // goal badge
    const badge = document.getElementById('goalBadge');
    if (state.total >= state.goal) badge.classList.add('show');
    else badge.classList.remove('show');

    // history
    const list = document.getElementById('historyList');
    if (state.entries.length === 0) {
      list.innerHTML = `<div class="empty-state"><div class="empty-icon">💧</div>Nessuna bevuta registrata oggi</div>`;
    } else {
      list.innerHTML = state.entries.map(e => `
        <div class="history-item">
          <div class="history-left">
            <div class="history-dot"></div>
            <div>
              <div class="history-ml">${e.ml} ml</div>
              <div class="history-source">${e.label}</div>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:4px">
            <span class="history-time">${e.time}</span>
            <button class="history-del" onclick="deleteEntry(${e.id})">×</button>
          </div>
        </div>
      `).join('');
    }
  }

  // ─── TOAST ───────────────────────────────────────────────
  let toastTimeout;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => t.classList.remove('show'), 2000);
  }

  function shakeInput(el) {
    el.style.animation = 'none';
    el.offsetHeight;
    el.style.animation = 'shake 0.4s ease';
    setTimeout(() => el.style.animation = '', 400);
  }

  // ─── PERSISTENCE ─────────────────────────────────────────
  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) state = JSON.parse(raw);
    } catch(e) {}
  }

  // ─── START ───────────────────────────────────────────────
  init();
</script>

<style>
@keyframes shake {
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-6px)}
  75%{transform:translateX(6px)}
}
</style>
</body>
</html>
